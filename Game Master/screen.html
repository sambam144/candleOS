<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GM Screen (All‑in‑One)</title>
    <link rel="stylesheet" href="screen.css" />
  </head>
  <body>
    <div id="modal-container"></div>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><span class="dot"></span> GM Screen</div>
        <div class="search">
          <input id="globalSearch" placeholder="Search monsters, items, conditions…" />
        </div>
        <div class="nav" id="nav"></div>
        <div style="margin-top: 16px; font-size: 12px; color: var(--muted)">
          <div>Data auto-saves in your browser (localStorage).</div>
          <div class="row" style="margin-top: 8px">
            <button class="btn small" onclick="exportState()">
              Export JSON
            </button>
            <label
              class="btn small"
              for="importFile"
              style="cursor: pointer; margin-bottom: 0"
              >Import JSON</label
            >
            <input
              id="importFile"
              type="file"
              accept="application/json"
              class="hidden"
              onchange="importState(this.files[0])"
            />
          </div>
          <div class="row" style="margin-top: 8px">
            <button
              class="btn small danger"
              onclick="resetState()"
              title="Delete everything"
            >
              Reset All Data
            </button>
          </div>
        </div>
      </aside>

      <section class="content">
        <header class="toolbar">
          <div class="group">
            <span class="chip"
              >Initiative <span id="initiativeCount">0</span></span
            >
            <span class="chip">Session Log <span id="logCount">0</span></span>
            <span class="chip">Notes <span id="noteCount">0</span></span>
            <span class="chip">Monsters <span id="monsterCount">0</span></span>
            <span class="chip">Items <span id="itemCount">0</span></span>
            <span class="chip"
              >NPC Roster <span id="npcRosterCount">0</span></span
            >
            <span class="chip">Locations <span id="locationCount">0</span></span>
            <span class="chip">Party <span id="partyCount">0</span></span>
          </div>
          <div class="group">
            <button class="btn small" onclick="runTests()">Run Tests</button>
            <button class="btn small" onclick="toggleTheme()">
              Toggle Theme
            </button>
          </div>
        </header>

        <main id="view">
          </main>
      </section>
    </div>

    <script src="screen.js" defer></script>
  </body>
</html>
