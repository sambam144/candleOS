<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>5e Character Sheet (GM‑Screen Style)</title>
    <link rel="stylesheet" href="character.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><span class="dot"></span> Character Sheet</div>
        <div class="nav" id="nav"></div>
        <div style="margin-top: 16px; font-size: 12px; color: var(--muted)">
          <div>Data auto-saves in your browser.</div>
          <div class="row" style="margin-top: 8px">
            <button class="btn small" id="exportBtn">Export JSON</button>
            <label
              class="btn small"
              for="importFile"
              style="cursor: pointer; margin-bottom: 0"
              >Import JSON</label
            >
            <input
              id="importFile"
              type="file"
              accept="application/json"
              style="display: none"
            />
          </div>
          <div class="row" style="margin-top: 8px">
            <button class="btn small danger" id="resetBtn">Reset All</button>
          </div>
        </div>
      </aside>
      <section class="content">
        <header class="toolbar">
          <div class="group">
            <span class="chip">Level <span id="kLevel">1</span></span>
            <span class="chip">Prof <span id="kProf">+2</span></span>
            <span class="chip">AC <span id="kAC">10</span></span>
            <span class="chip">HP <span id="kHP">10/10</span></span>
            <span class="chip">Speed <span id="kSpeed">30</span></span>
          </div>
          <div class="group">
            <button class="btn small" id="themeBtn">Toggle Theme</button>
            <button class="btn small" id="printBtn">Print</button>
          </div>
        </header>
        <main id="view"></main>
      </section>
    </div>
    <script src="character.js" defer></script>
  </body>
</html>
